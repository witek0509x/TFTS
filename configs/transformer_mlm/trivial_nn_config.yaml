# Transformer MLM Model Small Configuration
# For quick tests and debugging

# Experiment settings
experiment:
  name: "simple_nn_experiment"
  project: "simple_nn_esn"
  tags: ["transformer", "mlm", "echo_state", "small"]
  log_model: true

# Model settings
model:
  d_model: 256
  nhead: 8
  num_layers: 8
  dim_feedforward: 1024
  input_dim: 1
  input_len: 100
  lr: 0.001
  masking_ratio: 0.1  # Percentage of tokens to mask during training

# Dataset settings
dataset:
  # Echo State Network parameters
  esn:
    n_input: 1
    n_reservoir: 100
    spectral_radius: 0.9
    sparsity: 0.1
    input_scaling: 0.1
    leak_rate: 0.99
    esn_id: 41
    roll_every: 5
  
  # Dataset parameters
  train:
    num_series: 1000
    series_length: 100
    tile_size: 1
    stride: 1
    padding: 0
    initial_seed: 100
    non_repeat: false
    batch_size: 16
    shuffle: false
  
  val:
    num_series: 100
    series_length: 100
    tile_size: 1
    stride: 1
    padding: 0
    initial_seed: 0
    non_repeat: false
    batch_size: 16
    shuffle: false

# Training settings
training:
  max_epochs: 100000
  device: "cuda"
  checkpoint:
    monitor: "val_loss"
    save_top_k: 1
    mode: "min"
    filename: "transformer-non-learnable-{epoch:02d}-{val_loss:.6f}"
  n_epoch_checkpoint:
    every_n_epochs: 2000
    save_top_k: -1
    filename: "transformer-non-learnable-every-n-epoch-{epoch:06d}"